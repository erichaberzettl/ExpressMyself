<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ExpressMyself logo">
  <!--
    ExpressMyself logo — small-size artwork (used for 16/32px toolbar icons).
    Same speech-bubble + quotation-mark shapes as icon-master.svg, but the
    bubble fills more of the tile and the marks are scaled up so the mark
    survives at 16px. Regenerate PNGs with: npm run build:icons
  -->
