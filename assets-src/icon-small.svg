      <stop stop-color="#E3714B"/>
      <stop offset="1" stop-color="#C54D2A"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tileS)"/>
  <g>
