<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ExpressMyself logo">
  <!--
    ExpressMyself website tab favicon — the speech-bubble mark WITHOUT the tile
    background ("the actual logo"), recolored so it stays legible on light and
    dark browser tabs: a terracotta bubble with the quotation marks knocked out
    in cream. The extension/store icons still use icon-master.svg (the tile).
    Regenerate app/icon.png + app/favicon.png + app/icon.svg with:
      npm run build:icons
  -->
  <defs>
    <linearGradient id="bubble" x1="34" y1="46" x2="222" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3714B"/>
      <stop offset="1" stop-color="#C54D2A"/>
    </linearGradient>
  </defs>
  <rect x="34" y="46" width="188" height="122" rx="42" fill="url(#bubble)"/>
  <path d="M84 158 L124 158 L62 212 Z" fill="url(#bubble)"/>
  <g fill="#FFF6EC" transform="translate(60,66) scale(1.5)">
    <path d="M43 21C43 9.4 33.6 0 22 0C10.4 0 1 9.4 1 21C1 30 6.6 36.4 15 38C10.5 43 5.5 47.5 2 53C16 50 29 41.5 37 29C41 24 43 22.6 43 21Z"/>
    <path d="M43 21C43 9.4 33.6 0 22 0C10.4 0 1 9.4 1 21C1 30 6.6 36.4 15 38C10.5 43 5.5 47.5 2 53C16 50 29 41.5 37 29C41 24 43 22.6 43 21Z" transform="translate(48,0)"/>
  </g>
</svg>
